  - title: "LocoWM: High-Precision Locomotion through World-Model-Guided Residual Adaptation"
    authors: <strong>Zijie Zhao<sup>*</sup></strong>, Shengqian Chen<sup>*</sup>, Xiaoxu Wang, Han Jiang, Yuanheng Zhu, Dongbin Zhao
    category: first_author
    conference_short: arxiv
    conference: arxiv eprint, 2026.
    pdf: https://arxiv.org/pdf/2609.39179
    code: https://github.com/zhaozijie2022/locowm
    page: https://zhaozijie2022.github.io/locowm/
    # image: ./assets/img/first_author/teaser_locowm.gif
    image: ./assets/img/first_author/teaser_locowm.png
    abstract: >
      High-precision locomotion combines motion-command tracking with precise regulation of task-relevant physical states, enabling robots to interact reliably with their surroundings during motion. Joint end-to-end optimization can leave precision objectives insufficiently optimized, while reactive residual control adjusts actions only after deviations become observable. We present \textbf{LocoWM}, a world-model-guided preactive residual adaptation framework for high-precision locomotion. A base policy provides command-following locomotion, while an action-conditioned world model predicts a sequence of future physical states from proprioceptive history and the proposed base action. A residual adapter conditions on this predicted sequence to generate additive action corrections that compensate for anticipated deviations. Two-stage training first learns locomotion and action-conditioned dynamics, then freezes both modules while training the adapter, separating locomotion acquisition from precision adaptation. Experiments spanning terrain leveling, acceleration compensation, and push recovery demonstrate improved control precision and disturbance robustness over end-to-end and reactive residual baselines.
    bibtex_show: |
      @misc{zhao2026locowm,
          title={LocoWM: High-Precision Locomotion through World-Model-Guided Residual Adaptation}, 
          author={Zijie Zhao, Shengqian Chen, Xiaoxu Wang, Han Jiang, Yuanheng Zhu and Dongbin Zhao},
          year={2026},
          eprint={2609.39179},
