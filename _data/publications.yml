  - title: Empowering Multi-Robot Cooperation via Sequential World Models
    authors: <strong>Zijie Zhao</strong>, Honglei Guo, Shengqian Chen, Kaixuan Xu, Bo Jiang, Yuanheng Zhu, Dongbin Zhao
    category: first_author
    conference_short: ICLR
    conference: International Conference on Learning Representations <strong>(ICLR)</strong>, 2026.
    pdf: https://arxiv.org/pdf/2509.13095
    code: https://github.com/zhaozijie2022/seqwm
    page: https://zhaozijie2022.github.io/seqwm/
    # image: ./assets/img/gifs/teaser_seqwm.gif
    image: ./assets/img/first_author/teaser_seqwm.png
    abstract: >
      Model-based reinforcement learning (MBRL) has shown significant potential in robotics due to its high sample efficiency and planning capability. However, extending MBRL to multi-robot cooperation remains challenging due to the complexity of joint dynamics. To address this, we propose the Sequential World Model (SeqWM), a novel framework that integrates the sequential paradigm into model-based multi-agent reinforcement learning. SeqWM employs independent, sequentially structured agent-wise world models to decompose complex joint dynamics. Latent rollouts and decision-making are performed through sequential communication, where each agent generates its future trajectory and plans its actions based on the predictions of its predecessors. This design enables explicit intention sharing, enhancing cooperative performance, and reduces communication overhead to linear complexity. Results in challenging simulated environments (Bi-DexHands and Multi-Quad) show that SeqWM outperforms existing state-of-the-art model-free and model-based baselines in both overall performance and sample efficiency, while exhibiting advanced cooperative behaviors such as predictive adaptation and role division. Furthermore, SeqWM has been success fully deployed on physical quadruped robots, demonstrating its effectiveness in real-world multi-robot systems.
    bibtex_show: |
      @inproceedings{zhao2026seqwm,
        title     = {Empowering Multi-Robot Cooperation via Sequential World Models},
        author    = {Zijie Zhao and Honglei Guo and Shengqian Chen and Kaixuan Xu and Bo Jiang and Yuanheng Zhu and Dongbin Zhao},
        booktitle = {The Fourteenth International Conference on Learning Representations},
        year      = {2026},
        url       = {https://openreview.net/forum?id=IvUM6UwYCJ}
      }

  - title: Learning and Planning Multiple Tasks via a MoE-based World Model
    authors: <strong>Zijie Zhao</strong>, Zhongyue Zhao, Kaixuan Xu, Yuqian Fu, Jiajun Chai, Yuanheng Zhu, Dongbin Zhao
    category: first_author
    conference_short: NeurIPS
    conference: Advances in Neural Information Processing Systems <strong>(NeurIPS)</strong>, 2025.
    pdf: https://openreview.net/forum?id=fi24ry0BX5
    code: https://github.com/zhaozijie2022/moewm
    page: https://zhaozijie2022.github.io/moewm/
    # image: ./assets/img/gifs/teaser_m3w.gif
    image: ./assets/img/first_author/teaser_m3w.png
    abstract: >
      Multi-task reinforcement learning aims to develop a single model capable of solving a diverse set of tasks. However, existing methods often fall short due to the substantial variation in optimal policies across tasks, making it challenging for a single policy model to generalize effectively. In contrast, we find that many tasks exhibit bounded similarity in their underlying dynamics—highly similar within certain groups (e.g., door-open/close) diverge significantly between unrelated tasks (e.g., door-open & object-catch). To leverage this property, we reconsider the role of modularity in multi-task learning, and propose M3W, a novel approach that applies mixture-of-experts (MoE) to world model instead of policy, enabling both learning and planning. For learning, it uses a SoftMoE-based dynamics model alongside a SparseMoE-based predictor to facilitate knowledge reuse across similar tasks while avoiding gradient conflicts across dissimilar tasks. For planning, it evaluates and optimizes actions using the predicted rollouts from the world model, without relying directly on a explicit policy model, thereby overcoming the limitations of policy-centric methods. As the first MoE-based multi-task world model, M3W demonstrates superior performance, sample efficiency, and multi-task adaptability, as validated on Bi-DexHands with 14 tasks and Mujoco with 24 tasks.
    bibtex_show: |
      @inproceedings{zhao2025m3w,
        title     = {Learning and Planning Multi-Agent Tasks via a MoE-based World Model},
        author    = {Zhao, Zijie and Zhao, Zhongyue and Xu, Kaixuan and Fu, Yuqian and Chai, Jiajun and Zhu, Yuanheng and Zhao, Dongbin},
        booktitle = {Advances in Neural Information Processing Systems},
        year      = {2025}
      }

  - title: "Meta Learning Task Representation in Multiagent Reinforcement Learning: From Global Inference to Local Inference"
    authors: <strong>Zijie Zhao</strong>, Yuqian Fu, Jiajun Chai, Yuanheng Zhu, Dongbin Zhao
    category: first_author
    conference_short: IEEE TNNLS
    conference: IEEE Transactions on Neural Networks and Learning Systems <strong>(TNNLS)</strong>, 2025.
    pdf: https://ieeexplore.ieee.org/abstract/document/10905042
    code: https://github.com/zhaozijie2022/mg2l
    image: ./assets/img/first_author/teaser_mg2l.png
    abstract: >
      Multiagent meta reinforcement learning (MAMRL) enables multiagent systems (MASs) to adapt to multiple tasks. However, partial observability poses a significant challenge by hindering efficient task inference from agents' limited local experiences. To address this, we propose MG2L, a novel algorithm featuring a global-to-local (G2L) training scheme based on mutual information optimization (MIO). We first extend the centralized training and decentralized execution (CTDE) framework to MAMRL, and introduce a multilevel task encoder for joint global and local task inference. Building on this encoder, the MG2L scheme employs tailored loss functions to optimize task representations. For global inference, the MAS learns a centralized global representation by maximizing the MI between the representation and the task context. For local inference, we formulate conditional MI reduction to quantify the G2L gap. Agents then learn the local representation by minimizing this reduction. The MG2L scheme effectively harmonizes centralized training with decentralized execution, offering a versatile solution for MAMRL challenges. Additionally, we integrate a permutation-invariant attention (PIA) module into the task encoder to reduce sensitivity to behavior policy variations. Extensive experiments—including comparative analyses, ablation studies, meta-test evaluations, and visualizations—demonstrate MG2L's effectiveness.
    bibtex_show: |
      @article{zhao2025mg2l,
        author={Zhao, Zijie and Fu, Yuqian and Chai, Jiajun and Zhu, Yuanheng and Zhao, Dongbin},
        journal={IEEE Transactions on Neural Networks and Learning Systems}, 
        title={Meta Learning Task Representation in Multiagent Reinforcement Learning: From Global Inference to Local Inference}, 
        year={2025},
        volume={36},
        number={8},
        pages={14908-14921}
      }
  
  - title: "Opinion dynamics of social networks with intermittent-influence leaders"
    authors: <strong>Zijie Zhao</strong>, Lei Shi, Tong Li, Jinliang Shao, Yuhua Cheng
    category: first_author
    conference_short: IEEE TCSS
    conference: IEEE Transactions on Computational Social Systems <strong>(TCSS)</strong>, 2023.
    pdf: https://ieeexplore.ieee.org/abstract/document/9711916/
    image: ./assets/img/first_author/teaser_opinion.png
    abstract: >
      This article constructs a leader-follower architecture by introducing intermittent-influence opinion leaders to the DeGroot model and analyzes the influence of this type of leaders on the evolution of opinions. Different from the existing studies where the leaders can convey their opinions to the followers uninterruptedly, the leaders in this article can only convey its opinion by broadcasting at some intermittent moments. First, we analyze the relationship between the leaders' broadcast moments and the consensus opinion of followers and explain that the marginal revenue of the broadcasts is diminishing. Second, we describe the connotation of assimilation and calculate the minimum number of broadcasts required for the leaders to assimilate the followers' opinions. Finally, aiming to make the consensus opinion of the followers and the leaders' as close as possible, we give an optimal strategy on how to select followers to broadcast. The correctness of theoretical results is verified by numerical simulations.
    bibtex_show: |
      @article{zhao2022opinion,
        author={Zhao, Zijie and Shi, Lei and Li, Tong and Shao, Jinliang and Cheng, Yuhua},
        journal={IEEE Transactions on Computational Social Systems}, 
        title={Opinion Dynamics of Social Networks With Intermittent-Influence Leaders}, 
        year={2023},
        volume={10},
        number={3},
        pages={1073-1082}
      }
  
  - title: "G0.5: One Autoregressive Stream for Robot Reasoning and Action"
    authors: Galaxea AI Research
    category: other
    conference_short: Tech Report
    conference:  Technical Report, 2026.
    pdf: https://arxiv.org/pdf/2608.11739
    code: https://github.com/OpenGalaxea/GalaxeaVLA
    page: https://opengalaxea.github.io/G05/
    image: ./assets/img/others/teaser_g05.png
    abstract: >
      "The prevailing recipe for Vision-Language-Action (VLA) models couples a pretrained VLM with a separately trained flow-matching action expert. This makes the VLM a context encoder rather than a decision-maker. Instead, we argue for focusing on the VLM backbone: a unified model with a single set of weights that generates both reasoning and actions within a single autoregressive token stream. We introduce G0.5, a pretrained autoregressive VLA in which a single transformer decoder emits reasoning and action tokens under a single objective. Three components make this tractable at foundation-model scale: a learnable cross-embodiment action tokenizer that maps heterogeneous robot actions into a shared vocabulary; a native chain-of-thought stream interleaving task decomposition, object grounding, and action hints with action tokens; and a visual memory module that injects multi-second history through the vision encoder. Because reasoning and action share a single set of weights, the pretrained VLM’s capabilities carry over to physical behavior: the model follows instructions closely, and prompts directly steer action granularity, task horizon, and out-of-distribution scene handling without further training. Pretrained on a large collection of robot datasets together with VQA samples, G0.5 surpasses state-of-the-art models across 7 independent regimes: real-world fine-tuning on R1-Lite/R1-Pro robots (76.7% vs. 53.3% for 𝜋0.5 and 24.4% for GR00T-N1.7), the 2025 BEHAVIOR Challenge on 50 long-horizon household mobile manipulation tasks using a generalist policy (31.4% vs. 26.3% for 𝜋0.5 and 26.1% for the challenge winner), DROID post-training followed by zero-shot transfer to an unseen environment and objects (82.5%), a language-following Pick-and-Place benchmark, LIBERO (98.9%), RoboTwin 2.0 (93.3%), and SimplerEnv-Bridge (87.3%)."
    bibtex_show: |
      @misc{liu2026g05autoregressivestreamrobot,
        title={G0.5: One Autoregressive Stream for Robot Reasoning and Action},
        author={Yicheng Liu and Zibin Dong and Baijun Ye and Tianyuan Yuan and Tao Jiang and Anqi Yang and Shicheng Cao and Haonan Liu and Yue Sun and Zihan Guo and Xiao Liu and Ke Dong and Changxun Pan and Chenru Wu and Tailai Cheng and Xiaoshu Ren and Xinlei Zhang and Jianning Cui and Zijie Zhao and Haoyu Zhang and Kaiming Xu and Haodong Yang and Bowen Zhang and Jiahui Niu and Shaoting Zhu and Shiduo Zhang and Hang Zhao},
        year={2026},
        eprint={2608.11739},
        archivePrefix={arXiv},
        primaryClass={cs.RO},
        url={https://arxiv.org/abs/2608.11739}
      }

  - title: "FoM: Field-of-View-Aware Graph Neural Learning for Min–Max Multi-Robot Patrol Path Planning"
    authors: Binbin Zuo, Xueyi Liu, <strong>Zijie Zhao</strong>, Yaocheng Zhang, Kaixuan Xu, Weifan Li, Jishiyu Ding, Xun Wang, Zonglei Bai, Zhe Ma, Yuanheng Zhu
    category: other
    conference_short: IEEE RA-L
    conference: IEEE Robotics and Automation Letters <strong>(RA-L)</strong>, 2026.
    pdf: https://ieeexplore.ieee.org/abstract/document/11669973/
    image: ./assets/img/others/teaser_fom_zuo.png
    abstract: >
      Multi-robot patrol path planning is conventionally formulated as the min-max multiple traveling salesman problem (min-max mTSP). Existing formulations typically assume robots must physically visit each target, overlooking their visual perception capabilities. However, in many scenarios, targets are considered covered once they fall within a robot's field-of-view (FOV). To exploit this, we introduce a novel variant, the min-max mTSP with FOV, incorporating viewing directions into the optimization process. To efficiently solve this, we propose FoM, a sequential planning framework powered by a graph neural network (GNN) trained via reinforcement learning (RL). Instead of optimizing paths from scratch for each specific instance, FoM functions as a sequential decision-maker that iteratively selects nodes and sensing directions, achieving robust zero-shot generalization to unseen maps without retraining. Evaluations on synthetic and real-world maps demonstrate that FoM achieves remarkable performance, highlighting its practical effectiveness for multi-robot coordination.
    bibtex_show: |
      @article{zuo2026fom,
        author={Zuo, Binbin and Liu, Xueyi and Zhao, Zijie and Zhang, Yaocheng and Xu, Kaixuan and Li, Weifan and Ding, Jishiyu and Wang, Xun and Bai, Zonglei and Ma, Zhe and Zhu, Yuanheng},
        journal={IEEE Robotics and Automation Letters},
        title={{FoM}: Field-of-View-Aware Graph Neural Learning for Min--Max Multi-Robot Patrol Path Planning},
        year={2026},
        volume={11},
        number={10},
        pages={12080--12087},
        doi={10.1109/LRA.2026.3728375},
        url={https://ieeexplore.ieee.org/document/11669973/}
      }

  - title: "CriticSearch: Fine-Grained Credit Assignment for Search Agents via a Retrospective Critic"
    authors: Yaocheng Zhang, Haohuan Huang, Zijun Song, Yuanheng Zhu, <strong>Zijie Zhao</strong>, Qichao Zhang, Dongbin Zhao
    category: other
    conference_short: ACL
    conference: The 64th Annual Meeting of the Association for Computational Linguistics <strong>(ACL)</strong>, 2026.
    pdf: https://arxiv.org/pdf/2511.12159
    image: ./assets/img/others/teaser_criticsearch_zhang.png
    abstract: >
      Tool-Integrated Reasoning (TIR) with search engines enables large language models to iteratively retrieve up-to-date external knowledge, enhancing adaptability and generalization in complex question-answering tasks. However, existing search agent pipelines typically depend on reinforcement learning based optimization, which often suffers from sparse outcome rewards, leading to inefficient exploration and unstable training. We introduce CriticSearch, a fine-grained credit-assignment framework that supplies dense, turn-level feedback via a retrospective critic mechanism. During training, a frozen, asymmetric critique LLM retrospectively evaluates each turn using privileged information from the full trajectory and gold answers, converting these assessments into stable, dense rewards that guide policy improvement. Experimental results across diverse multi-hop reasoning benchmarks demonstrate that CriticSearch consistently outperforms existing baselines, achieving faster convergence, improved training stability, and higher performance.
    bibtex_show: |
      @article{zhang2025criticsearch,
        title={CriticSearch: Fine-Grained Credit Assignment for Search Agents via a Retrospective Critic},
        author={Zhang, Yaocheng and Huang, Haohuan and Song, Zijun and Zhu, Yuanheng and Zhang, Qichao and Zhao, Zijie and Zhao, Dongbin},
        journal={arXiv preprint arXiv:2511.12159},
        year={2025}
      }




